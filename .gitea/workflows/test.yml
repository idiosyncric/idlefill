# Full test suite — the gate. Runs on every push + PR to main.
# Runner: idlefill-urza (arm64 macOS, Xcode CLT + node + python3).
name: test

# Pin the env so the pipeline is hermetic regardless of the host daemon's
# environment: npm ci must install devDependencies (tsx is the test runner
# for the server + client suites), so NODE_ENV must not be "production".
env:
  NODE_ENV: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "full suite (server + client + adapter + types + tauri shell)"
    runs-on: urza
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm ci --no-audit --no-fund

      - name: "tests (all workspaces: server + client + adapter)"
        run: npm test

      - name: typecheck (server + client)
        run: |
          npx tsc --noEmit -p server/tsconfig.json
          npx tsc --noEmit -p client/tsconfig.json

      - name: build (all workspaces)
        run: npm run build

      - name: mcp server syntax
        run: node --check adapters/career-ops/idlefill-mcp.mjs

      # ---- tauri shell gates (issue #69 D9: the swiftc -parse gates retired
      # WITH the Swift trees; the shell is Rust now) ----
      # The runner (urza, this Mac) carries the Rust toolchain; the label is
      # the same urza:host as every other job.

      - name: "tauri: cargo fmt --check"
        run: cargo fmt --check --manifest-path tauri/src-tauri/Cargo.toml

      - name: "tauri: cargo clippy (-D warnings)"
        run: cargo clippy -- -D warnings --manifest-path tauri/src-tauri/Cargo.toml

      - name: "tauri: cargo test"
        run: cargo test --manifest-path tauri/src-tauri/Cargo.toml

      - name: "tauri: cargo build (debug — the bundle-plumbing smoke)"
        run: cargo build --manifest-path tauri/src-tauri/Cargo.toml
