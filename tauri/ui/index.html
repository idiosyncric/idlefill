<!doctype html>
<!-- The bundled settings window (D4-shape): the three launchd toggles,
     the runs:/note lines, the repo path, the marker. It holds NO arbiter
     data — shell chrome only. Its IPC reach is the capability file
     (capabilities/default.json: local windows only, no remote block),
     so the arbiter page can never call these verbs. The React entry is
     src/settings.tsx (tauri/ui workspace); this file is the SOURCE —
     the built copy lands in tauri/settings-ui/ and is what ships. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>idlefill settings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/settings.tsx"></script>
  </body>
</html>
